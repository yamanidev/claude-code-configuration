<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <title>Status line example: the three metrics are color-coded independently</title>
  <style>
    text { fill: #8b949e; }
    .g { fill: #22c55e; }
    .y { fill: #eab308; }
    .r { fill: #ef4444; }
  </style>

  <rect width="100%" height="100%" fill="#0d1117"/>

  <text x="12" y="22">claude-code-configuration</text>
  <text x="12" y="42">Opus 4.8 (1M context)</text>
  <text x="12" y="62">5h: <tspan class="g">23%</tspan> (⟳ 2h) · 7d: <tspan class="g">41%</tspan> (⟳ 3d) · context: <tspan class="y">114k</tspan></text>

  <text x="12" y="102">my-project · personal</text>
  <text x="12" y="122">Opus 4.8 (1M context)</text>
  <text x="12" y="142">5h: <tspan class="y">78%</tspan> (⟳ 45m) · 7d: <tspan class="r">94%</tspan> (⟳ 1d) · context: <tspan class="g">47k</tspan></text>

  <text x="12" y="182">some-api</text>
  <text x="12" y="202">Sonnet 4.5 (200k context)</text>
  <text x="12" y="222">5h: <tspan class="r">96%</tspan> (⟳ 12m) · 7d: <tspan class="y">82%</tspan> (⟳ 2d) · context: <tspan class="r">180k</tspan></text>
</svg>

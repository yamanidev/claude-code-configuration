name: validate

on:
  push:
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/validate_skills.py'
      - 'settings.json'
      - 'statusline.json'
      - 'scripts/build_settings.sh'
      - 'scripts/validate_settings.sh'
      - '.github/workflows/validate.yaml'

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Validate SKILL.md frontmatter against the Agent Skills spec
        run: uv run scripts/validate_skills.py

  validate-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check settings.json and statusline.json build cleanly
        run: bash scripts/validate_settings.sh
